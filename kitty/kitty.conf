# Aparência e atalhos (tema Dracula em current-theme.conf)

# ========================
# FONTES
# ========================
font_family JetBrainsMono NFM Regular
bold_font JetBrainsMono NFM Bold
italic_font JetBrainsMono NFM Italic
bold_italic_font JetBrainsMono NFM Bold Italic

font_size 14
# Ligaduras (+liga, +calt) já vêm ligadas por padrão no kitty
disable_ligatures never

# ========================
# JANELA
# ========================
# Padding de 5 em todos os lados, com a grade centralizada (window-padding-balance)
window_padding_width 5
placement_strategy center

# Tamanho inicial em células
remember_window_size no
initial_window_width 140c
initial_window_height 40c

background_opacity 1.0

# Sem barra de título/bordas; abas do kitty não são usadas (quem cuida disso é o tmux)
hide_window_decorations yes
tab_bar_style hidden

# ========================
# COMPORTAMENTO
# ========================
copy_on_select clipboard
confirm_os_window_close 0
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0
enable_audio_bell no

# ========================
# ATALHOS
# ========================
# Abas e splits são do tmux; do kitty ficam só copiar/colar, fonte e nova janela.
clear_all_shortcuts yes

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+n new_os_window
map ctrl+shift+f5 load_config_file

# Shift+Enter como ESC+Enter: o tmux não repassa o protocolo de teclado do kitty,
# e ESC+Enter é a quebra de linha que Claude Code/opencode/codex/zsh entendem.
map shift+enter send_text all \x1b\r

# Atalhos sem prefix repassados ao tmux como CSI u (ver tmux/tmux.conf).
# Sem isso o kitty mandaria Ctrl+Shift+h igual a Ctrl+h.
map ctrl+shift+o send_text all \x1b[111;6u
map ctrl+shift+e send_text all \x1b[101;6u
map ctrl+shift+h send_text all \x1b[104;6u
map ctrl+shift+j send_text all \x1b[106;6u
map ctrl+shift+k send_text all \x1b[107;6u
map ctrl+shift+l send_text all \x1b[108;6u
map ctrl+shift+t send_text all \x1b[116;6u
map ctrl+shift+w send_text all \x1b[119;6u
map ctrl+shift+enter send_text all \x1b[13;6u
map ctrl+tab send_text all \x1b[9;5u
map ctrl+shift+tab send_text all \x1b[9;6u

# BEGIN_KITTY_THEME
# Dracula
include current-theme.conf
# END_KITTY_THEME

# Abre direto numa sessão tmux (reaproveita a sessão "main" se já existir).
# O tmux herda o SHELL daqui e abre os panes em zsh.
env SHELL=/usr/bin/zsh
shell /usr/bin/tmux new-session -A -s main
