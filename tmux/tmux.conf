#--------------------------------------------------------------------------
# Configuration
#--------------------------------------------------------------------------

#Use Vi mode
setw -g mode-keys vi

# Start window and pane numbering from 1 for easier switching
set -g base-index 1
setw -g pane-base-index 1

# Allow automatic renaming of windows
set -g allow-rename on

# Renumber windows when one is removed.
set -g renumber-windows on

# Terminal dentro do tmux. Truecolor e formato do cursor vêm do terminfo
# do kitty/ghostty (Tc, Ss/Se), sem precisar de overrides.
set -g default-terminal "tmux-256color"

# Copiar pelo OSC 52 (funciona com kitty e ghostty)
set -g set-clipboard on

# Enable undercurl
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'

# Enable undercurl colors
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Allow the mouse to resize windows and select tabs
set -g mouse on

# Allow tmux to set the terminal title
set -g set-titles on

# Monitor window activity to display in the status bar
setw -g monitor-activity on

# A bell in another window should cause a bell in the current window
set -g bell-action any

# Don't show distracting notifications
set -g visual-bell off
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Useful when using sharing a session with different size terminals
setw -g aggressive-resize on

# don't detach tmux when killing a session
set -g detach-on-destroy off

# address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

#--------------------------------------------------------------------------
# Key Bindings
#--------------------------------------------------------------------------

# -r means that the bind can repeat without entering prefix again
# -n means that the bind doesn't use the prefix

# Set the prefix to Ctrl+Space
set -g prefix C-Space

# Send prefix to a nested tmux session by doubling the prefix
bind C-Space send-prefix

# 'PREFIX r' to reload of the config file
unbind r
bind r source-file ~/.tmux.conf\; display-message '~/.tmux.conf reloaded'

# Allow holding Ctrl when using using prefix+p/n for switching windows
bind C-p previous-window
bind C-n next-window

# Move around panes like in vim
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Switch between previous and next windows with repeatable
bind -r n next-window
bind -r p previous-window

# Move the current window to the next window or previous window position
bind -r N run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) + 1)"
bind -r P run-shell "tmux swap-window -t $(expr $(tmux list-windows | grep \"(active)\" | cut -d \":\" -f 1) - 1)"

# Switch between two most recently used windows
bind Space last-window

# Switch between two most recently used sessions
bind ^ switch-client -l

# Prefix to split window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Change the path for newly created windows
bind c new-window -c "#{pane_current_path}"

#--------------------------------------------------------------------------
# Atalhos no estilo do Ghostty (sem prefix)
#--------------------------------------------------------------------------

# O kitty envia Ctrl+Shift+letra, Ctrl+Shift+Enter e Ctrl+Tab como CSI u
# (ver kitty/kitty.conf); setas, Alt+número e Ctrl+PageUp/Down já chegam distintos.
# Ctrl+h/j/k/l ficam livres para o shell (Ctrl+l limpa a tela) e para o nvim.
set -s extended-keys on

# Splits
bind -n C-S-o split-window -h -c "#{pane_current_path}"
bind -n C-S-e split-window -v -c "#{pane_current_path}"
bind -n C-S-Enter resize-pane -Z
bind -n C-S-w kill-pane

# Navegar entre splits
bind -n C-S-h select-pane -L
bind -n C-S-j select-pane -D
bind -n C-S-k select-pane -U
bind -n C-S-l select-pane -R
bind -n C-S-Left select-pane -L
bind -n C-S-Down select-pane -D
bind -n C-S-Up select-pane -U
bind -n C-S-Right select-pane -R

# Redimensionar splits
bind -n M-S-Left resize-pane -L 5
bind -n M-S-Down resize-pane -D 5
bind -n M-S-Up resize-pane -U 5
bind -n M-S-Right resize-pane -R 5

# Abas (janelas do tmux)
bind -n C-S-t new-window -c "#{pane_current_path}"
bind -n C-Tab next-window
bind -n C-S-Tab previous-window
bind -n C-NPage next-window
bind -n C-PPage previous-window
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t ':{end}'

#--------------------------------------------------------------------------
# workmux (agentes em worktrees)
#--------------------------------------------------------------------------

bind C-s display-popup -h 30 -w 100 -E "workmux dashboard"
bind C-w display-popup -h 30 -w 100 -E "workmux dashboard --tab worktrees"
bind C-t run-shell "workmux sidebar"
bind L run-shell "workmux last-done"
bind Tab run-shell "workmux last-agent"

# Dracula
set -g @dracula-plugins "git time"
set -g @dracula-show-left-icon session
set -g @dracula-show-flags true
set -g @dracula-show-powerline false
set -g @dracula-time-format "%H:%M"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
