# Ferramentas globais (linkado em ~/.config/mise/config.toml).
# Instalar/atualizar: mise install / mise upgrade
# O Node continua com o fnm (ver zsh/custom/fnm.zsh).

[tools]
neovim = "latest"
fzf = "latest"
bat = "latest"
fd = "latest"
ripgrep = "latest"
jq = "latest"
lazygit = "latest"
gh = "latest"
tree-sitter = "latest"
workmux = "latest"
zoxide = "latest"

[tools."http:tmux-file-picker"]
version = "main"
url = "https://raw.githubusercontent.com/raine/tmux-file-picker/main/tmux-file-picker"
bin = "tmux-file-picker"
